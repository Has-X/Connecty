[package]
name = "connecty-agent"
version = "0.3.5"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["Chromatic"]
repository = "https://github.com/Has-X/Connecty"
description = "Lightweight native reverse SSH tunnel manager"

[[bin]]
name = "connecty-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fastrand = "2"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }
windows = {version = "0.62", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"]}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
rand = "0.10"
tokio = { version = "1.54.1", features = ["test-util"] }

# Vendored russh 0.64.1 with a client-side channel-reaping fix (leak on
# client-initiated closes); see vendor/russh/VENDORED-FIX.md.
[patch.crates-io]
russh = { path = "vendor/russh" }
